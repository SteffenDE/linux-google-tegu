%YAML 1.2
---
$id: http://devicetree.org/schemas/interconnect/google,zumapro-bts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Zumapro Bus Traffic Shaper

maintainers:
  - Steffen Deusch <steffen@deusch.me>

description: |
  The Samsung Bus Traffic Shaper (BTS) in Google's Zumapro SoC controls AXI
  quality of service at individual NoC masters and translates aggregate client
  bandwidth into minimum MIF and INT ACPM DVFS rates.

  The register resources describe the BTS blocks managed by this provider.
  These cover the MFC, ISPFE, DPU and G2D ports. Client bandwidth and workload
  tags select per-master clock floors and outstanding-transaction profiles.

properties:
  compatible:
    const: google,zumapro-bts

  reg:
    items:
      - description: MFC channel 0 BTS registers
      - description: MFC channel 1 BTS registers
      - description: DPU channel 0 BTS registers
      - description: DPU channel 1 BTS registers
      - description: ISPFE channel 0 BTS registers
      - description: ISPFE channel 1 BTS registers
      - description: ISPFE channel 2 BTS registers
      - description: ISPFE channel 3 BTS registers
      - description: G2D channel 0 BTS registers
      - description: G2D channel 1 BTS registers
      - description: G2D channel 2 BTS registers

  reg-names:
    items:
      - const: mfc0
      - const: mfc1
      - const: dpu0
      - const: dpu1
      - const: ispfe0
      - const: ispfe1
      - const: ispfe2
      - const: ispfe3
      - const: g2d0
      - const: g2d1
      - const: g2d2

  clocks:
    items:
      - description: MIF ACPM DVFS domain
      - description: INT ACPM DVFS domain

  clock-names:
    items:
      - const: mif
      - const: int

  '#interconnect-cells':
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - '#interconnect-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,zumapro-acpm.h>

    interconnect@26c48380 {
        compatible = "google,zumapro-bts";
        reg = <0x26c48380 0x80>, <0x26c48400 0x80>,
              <0x26c48000 0x80>,
              <0x26c48080 0x80>,
              <0x26c48180 0x80>,
              <0x26c48200 0x80>,
              <0x26c48280 0x80>,
              <0x26c48300 0x80>,
              <0x27048200 0x80>,
              <0x27048280 0x80>,
              <0x27048300 0x80>;
        reg-names = "mfc0", "mfc1", "dpu0", "dpu1", "ispfe0",
                    "ispfe1", "ispfe2", "ispfe3", "g2d0", "g2d1", "g2d2";
        clocks = <&acpm_ipc ZUMAPRO_CLK_ACPM_DVFS_MIF>,
                 <&acpm_ipc ZUMAPRO_CLK_ACPM_DVFS_INT>;
        clock-names = "mif", "int";
        #interconnect-cells = <1>;
    };
