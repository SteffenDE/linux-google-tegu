%YAML 1.2
---
$id: http://devicetree.org/schemas/display/google,zumapro-decon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G4 Zumapro Display and Enhancement Controller

maintainers:
  - Steffen Trumtrar <s.trumtrar@pengutronix.de>

description:
  The Zumapro DECON block is the display controller used in the Google Tensor
  G4 display pipeline.  It feeds the internal panel through DSIM and uses DPP
  blocks for fetch and composition.

properties:
  compatible:
    const: google,zumapro-decon

  reg:
    minItems: 4
    maxItems: 7

  reg-names:
    minItems: 4
    items:
      - const: main
      - const: win
      - const: sub
      - const: wincon
      - const: dqe
      - const: dqe-cgc
      - const: cgc-dma

  interrupts:
    minItems: 3
    maxItems: 6

  interrupt-names:
    minItems: 3
    maxItems: 6
    oneOf:
      - items:
          - const: frame_start
          - const: frame_done
          - const: extra
      - items:
          - const: frame_start
          - const: frame_done
          - const: extra
          - const: cgc-dma
      - items:
          - const: frame_start
          - const: frame_done
          - const: extra
          - const: dimming_start
          - const: dimming_end
          - const: cgc-dma

  google,decon-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 2
    description: DECON instance ID, translated from downstream decon,id.

  google,cgc-dma-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: CGC DMA DPP ID, translated from downstream cgc-dma,id.

  google,max-windows:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 14
    description: Maximum hardware windows, translated from downstream max_win.

  iommus:
    minItems: 1
    maxItems: 2

  samsung,iommu-group:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared Samsung System MMU group for DPUF0 and DPUF1.

  samsung,tzmp:
    type: boolean
    description: Downstream flag for TrustZone memory-protection integration.

  power-domains:
    minItems: 1
    maxItems: 2

  dpps:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    maxItems: 14
    description: DPP blocks available to this DECON.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description: Output port to the DSIM bridge.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - google,decon-id

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    display-controller@19470000 {
        compatible = "google,zumapro-decon";
        reg = <0x19470000 0x6000>,
              <0x19480000 0xe000>,
              <0x19490000 0x10000>,
              <0x194a0000 0xe000>,
              <0x194d0000 0xf000>,
              <0x194f0000 0x10000>,
              <0x1990e000 0x1000>;
        reg-names = "main", "win", "sub", "wincon", "dqe",
                    "dqe-cgc", "cgc-dma";
        interrupts = <GIC_SPI 243 IRQ_TYPE_LEVEL_HIGH 0>,
                     <GIC_SPI 242 IRQ_TYPE_LEVEL_HIGH 0>,
                     <GIC_SPI 241 IRQ_TYPE_LEVEL_HIGH 0>,
                     <GIC_SPI 240 IRQ_TYPE_LEVEL_HIGH 0>,
                     <GIC_SPI 239 IRQ_TYPE_LEVEL_HIGH 0>,
                     <GIC_SPI 255 IRQ_TYPE_LEVEL_HIGH 0>;
        interrupt-names = "frame_start", "frame_done", "extra",
                          "dimming_start", "dimming_end", "cgc-dma";
        google,decon-id = <0>;
        google,cgc-dma-id = <18>;
        google,max-windows = <14>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                decon_to_dsi: endpoint {
                    remote-endpoint = <&dsi_from_decon>;
                };
            };
        };
    };

    dsi {
        port {
            dsi_from_decon: endpoint {
                remote-endpoint = <&decon_to_dsi>;
            };
        };
    };
