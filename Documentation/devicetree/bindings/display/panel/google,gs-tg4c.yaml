%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/google,gs-tg4c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google GS TG4C 1080x2424 MIPI-DSI Panel

maintainers:
  - Steffen Deusch <steffen@deusch.me>

description:
  The Google GS TG4C is a command-mode AMOLED panel used in the Google
  Pixel 9a. It uses four MIPI-DSI data lanes and Display Stream Compression.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: google,gs-tg4c

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active-high panel reset GPIO.

  vci-supply:
    description: Analog panel supply.

  vddi-supply:
    description: Panel I/O supply.

  vddd-supply:
    description: Panel core supply.

  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - vci-supply
  - vddi-supply
  - vddd-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "google,gs-tg4c";
            reg = <0>;

            reset-gpios = <&gpp0 0 GPIO_ACTIVE_HIGH>;
            vci-supply = <&m_ldo14_reg>;
            vddi-supply = <&s_bucka_reg>;
            vddd-supply = <&disp_vddd>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
