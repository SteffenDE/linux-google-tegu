%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/samsung,sysmmu-group.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung System MMU group

maintainers:
  - Marek Szyprowski <m.szyprowski@samsung.com>

description:
  Samsung System MMU group nodes describe a shared IOMMU translation domain
  used by devices with more than one System MMU controller.

properties:
  compatible:
    const: samsung,sysmmu-group

required:
  - compatible

additionalProperties: false

examples:
  - |
    iommu-group-dpu {
        compatible = "samsung,sysmmu-group";
    };
