%YAML 1.2
---
$id: http://devicetree.org/schemas/display/google,zumapro-dpp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G4 Zumapro Display Pre-Processor

maintainers:
  - Steffen Trumtrar <s.trumtrar@pengutronix.de>

description:
  Zumapro DPP blocks fetch and pre-process framebuffers for the DECON display
  controller.  Early mainline bring-up models these blocks before enabling
  scanout so the DT topology can be validated without touching DPU registers.

properties:
  compatible:
    const: google,zumapro-dpp

  reg:
    minItems: 6
    maxItems: 6

  reg-names:
    items:
      - const: dma
      - const: dpp
      - const: scl_coef
      - const: sramc
      - const: hdr_comm
      - const: hdr

  interrupts:
    minItems: 2
    maxItems: 2

  interrupt-names:
    items:
      - const: dma
      - const: dpp

  google,dpp-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 13
    description: DPP instance ID, translated from downstream dpp,id.

  google,video-formats:
    type: boolean
    description: The DPP can fetch video formats in addition to RGB formats.

  google,dpp-attributes:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: DPP attribute bitmask, translated from downstream attr.

  google,axi-port:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: DPUF AXI port index, translated from downstream port.

  google,scale-down:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Maximum scale-down factor, translated from downstream scale_down.

  google,scale-up:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Maximum scale-up factor, translated from downstream scale_up.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - google,dpp-id

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    dpp@19900000 {
        compatible = "google,zumapro-dpp";
        reg = <0x19900000 0x1000>,
              <0x19930000 0x1000>,
              <0x19940000 0x4000>,
              <0x19950000 0x1000>,
              <0x19960000 0x1000>,
              <0x19980000 0x1000>;
        reg-names = "dma", "dpp", "scl_coef", "sramc", "hdr_comm", "hdr";
        interrupts = <GIC_SPI 256 IRQ_TYPE_LEVEL_HIGH 0>,
                     <GIC_SPI 265 IRQ_TYPE_LEVEL_HIGH 0>;
        interrupt-names = "dma", "dpp";
        google,dpp-attributes = <0x6d0867>;
        google,axi-port = <0>;
        google,scale-down = <4>;
        google,scale-up = <8>;
        google,dpp-id = <0>;
    };
