%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx712.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX712 CMOS Digital Image Sensor

maintainers:
  - Steffen Deusch <steffen@deusch.me>

description:
  The IMX712 is a Sony CMOS active pixel digital image sensor with a
  4208H x 3120V active array. It is programmed over I2C with 16-bit register
  addresses and 8-bit values, and sends image data over four MIPI CSI-2 D-PHY
  data lanes.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx712

  reg:
    maxItems: 1

  clocks:
    description: EXTCLK, the sensor master clock
    maxItems: 1

  reset-gpios:
    description: XCLR, asserted low to hold the sensor in reset
    maxItems: 1

  pinctrl-names:
    items:
      - const: default
      - const: sleep
    description:
      The master clock pad is muxed to its clock function in the default state
      and parked in the sleep state, so that it is only driven while the sensor
      is powered.

  iovdd-supply:
    description: Interface power supply (1.8V)

  avdd-supply:
    description: Analog power supply (2.8V)

  dvdd-supply:
    description: Digital power supply (1.2V)

  port:
    additionalProperties: false
    $ref: /schemas/graph.yaml#/$defs/port-base

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 4
            maxItems: 4

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - iovdd-supply
  - avdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@1a {
            compatible = "sony,imx712";
            reg = <0x1a>;

            clocks = <&imx712_clk>;

            iovdd-supply = <&camera_vddio_1v8>;
            avdd-supply = <&camera_vdda_2v8>;
            dvdd-supply = <&camera_vddd_1v2>;

            reset-gpios = <&gpio 2 GPIO_ACTIVE_LOW>;

            orientation = <1>;

            port {
                imx712_output: endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <552960000>;
                    remote-endpoint = <&csi_input>;
                };
            };
        };
    };
...
