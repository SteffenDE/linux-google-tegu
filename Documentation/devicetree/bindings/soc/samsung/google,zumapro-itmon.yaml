%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/samsung/google,zumapro-itmon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G4 interconnect transaction monitor

maintainers:
  - Steffen Deusch <steffen@deusch.me>

description:
  The interconnect transaction monitor records protocol errors and response
  timeouts in the five Zumapro NoC fabrics. Each fabric has separate monitors
  for data and configuration transactions.

properties:
  compatible:
    const: google,zumapro-itmon

  reg:
    minItems: 10
    maxItems: 10

  reg-names:
    items:
      - const: nocl1a-data
      - const: nocl1b-data
      - const: nocl2aa-data
      - const: nocl2ab-data
      - const: nocl0-data
      - const: nocl1a-config
      - const: nocl1b-config
      - const: nocl2aa-config
      - const: nocl2ab-config
      - const: nocl0-config

  interrupts:
    minItems: 10
    maxItems: 10

  interrupt-names:
    items:
      - const: nocl1a-data
      - const: nocl1b-data
      - const: nocl2aa-data
      - const: nocl2ab-data
      - const: nocl0-data
      - const: nocl1a-config
      - const: nocl1b-config
      - const: nocl2aa-config
      - const: nocl2ab-config
      - const: nocl0-config

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    itmon@26440000 {
        compatible = "google,zumapro-itmon";
        reg = <0x26440000 0x4000>, <0x26840000 0x4000>,
              <0x26c40000 0x4000>, <0x27040000 0x4000>,
              <0x26050000 0x4000>, <0x26450000 0x4000>,
              <0x26850000 0x4000>, <0x26c50000 0x4000>,
              <0x27050000 0x4000>, <0x26060000 0x4000>;
        reg-names = "nocl1a-data", "nocl1b-data", "nocl2aa-data",
                    "nocl2ab-data", "nocl0-data", "nocl1a-config",
                    "nocl1b-config", "nocl2aa-config", "nocl2ab-config",
                    "nocl0-config";
        interrupts = <GIC_SPI 619 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 624 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 628 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 632 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 596 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 620 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 625 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 629 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 633 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 597 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "nocl1a-data", "nocl1b-data", "nocl2aa-data",
                          "nocl2ab-data", "nocl0-data", "nocl1a-config",
                          "nocl1b-config", "nocl2aa-config", "nocl2ab-config",
                          "nocl0-config";
    };
