%YAML 1.2
---
$id: http://devicetree.org/schemas/media/google,zumapro-ispfe.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google zumapro ISPFE camera receive complex

maintainers:
  - Steffen Deusch <steffen@deusch.me>

description:
  BLK_ISPFE on Google's zumapro (Tensor G4) is the camera receive path - twelve
  CSIS links with nine combo D/C-PHYs behind them, the ISPFE front end, and a
  PDMA that carries per-frame descriptors.

properties:
  compatible:
    const: google,zumapro-ispfe

  reg:
    items:
      - description: ISPFE front end
      - description: CSIS links and their D/C-PHYs
      - description: ISPFE system registers
      - description: PDMA, inside the ISPFE front end window
      - description: PDMA wrapper, inside the ISPFE front end window
      - description: |
          CMU_ISPFE. Present because the block loses its clock mux, dividers
          and Q-channel requests across a power cycle and no clock controller
          is described for it; this window goes away when one is.

  reg-names:
    items:
      - const: isp-fe
      - const: csis-link-phy
      - const: isp-fe-sysreg
      - const: pdma
      - const: pdma-wrap
      - const: cmu

  power-domains:
    maxItems: 1

  samsung,iommu-group:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The shared IOMMU group object. Required by the System MMU v9 driver,
      which cannot attach a device whose group it did not create.

  iommus:
    items:
      - description: ISPFE System MMU S0
      - description: ISPFE System MMU S1
      - description: ISPFE System MMU S2
    description:
      All three instances, because they share one translation context - a frame
      buffer's address is invalidated in every one of them.

required:
  - compatible
  - reg
  - reg-names
  - power-domains
  - iommus
  - samsung,iommu-group

additionalProperties: false

examples:
  - |
    camera@1c300000 {
        compatible = "google,zumapro-ispfe";
        reg = <0x1c300000 0x100000>,
              <0x1c040000 0xd0000>,
              <0x1c020000 0x10000>,
              <0x1c390000 0x5000>,
              <0x1c395000 0x1000>,
              <0x1c000000 0x8000>;
        reg-names = "isp-fe", "csis-link-phy", "isp-fe-sysreg",
                    "pdma", "pdma-wrap", "cmu";
        power-domains = <&pd_ispfe>;
        iommus = <&sysmmu_ispfe_s0>, <&sysmmu_ispfe_s1>, <&sysmmu_ispfe_s2>;
        samsung,iommu-group = <&iommu_group_isp>;
    };
